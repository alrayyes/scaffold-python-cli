# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: uv's own
# version (the `version:` input on astral-sh/setup-uv in ci.yml) and the
# VALE_VERSION release binary in prose.yml. Neither lives anywhere
# Dependabot's ecosystems look. The gitleaks image is tracked through the stub
# Dockerfile in .github/gitleaks/, which gitleaks.yml builds.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and
      # the version number is computed from them. A `[project.dependencies]`
      # bump ships in the built package, so it's a change to what ships
      # whether or not it's security-relevant, and fix: cuts the patch
      # release the same way any other fix does. A `[dependency-groups.dev]`
      # bump (click-man, pyinstaller, pyproject-fmt, pytest, pytest-cov,
      # ruff) never ships in the package itself, so it stays chore: and
      # releases nothing. github-actions below stays ci: — it changes the
      # pipeline, not the artifact.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      # Grouping (even a group of one) keeps a major bump on Dependabot's
      # lowercase group-title template instead of falling back to its
      # sentence-case single-update one, which fails commitlint's
      # subject-case rule on the raw commit - see rules/releases.md.
      python-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # Nothing here is JavaScript. package.json exists so commitlint can
  # resolve the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-major:
        patterns: ["*"]
        update-types: [major]

  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, so the pin lives here.
  # ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule (rules/release-bots.md).
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
