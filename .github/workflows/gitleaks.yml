# Deliberately ungated: a secret can be committed to any file, so there's no
# diff this is safe to skip for — no `paths:` filter, unlike prose.yml.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pinned by tag and digest. The image's entrypoint is gitleaks, so it is
    # cleared to get a shell back for the steps below. Dependabot doesn't read
    # a workflow's container, so a bump is by hand, along with the pin in
    # CONTRIBUTING.md.
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      # The image has no node, which actions/checkout needs.
      - run: apk add --no-cache nodejs
      # fetch-depth: 0, or there's no history to walk and the job passes
      # having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The image's git refuses a checkout owned by another user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: gitleaks git --redact --no-banner
