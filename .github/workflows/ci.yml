# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - name: uv sync
        # Frozen, so a drifted uv.lock fails the job rather than silently
        # resolving to something nobody committed.
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check
      - name: ruff format --check
        run: uv run ruff format --check
      - name: pyproject-fmt --check
        run: uv run pyproject-fmt --check pyproject.toml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - run: uv sync --frozen
      - name: pytest
        # --junitxml is pytest's own built-in, no new dependency: Codecov's
        # Test Analytics reads it for failure/flake history alongside the
        # coverage percentage, and the published reports ship it as-is.
        # --cov-report=html writes htmlcov/, the browsable coverage view.
        run: |
          uv run pytest --cov=scaffold_python_cli --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=junit.xml | tee coverage.txt
          {
            echo '### Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
            htmlcov
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's own
          # restriction, not a misconfiguration here) - CODECOV_TOKEN is empty
          # on that run, and this repo's branch protection makes Codecov
          # refuse a tokenless upload ("Token required because branch is
          # protected"). That's an upload hiccup on an unprivileged run, not a
          # real test regression - true here would fail every Dependabot PR's
          # CI on that basis alone (confirmed live on #26/#27/#28).
          fail_ci_if_error: false
      # Run even when tests fail - a red PR is exactly the case Test
      # Analytics exists to explain, and a job that stops at the first
      # failing test never reaches an upload step gated behind success.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # Assembles site/reports/ from what the test job wrote. It runs on pull
  # requests too, so a broken step fails before the merge; only the deploy
  # below is default-branch-only. Every job in this workflow runs on main
  # whatever changed: a deploy replaces the whole site, so skipping this one
  # would delete the reports on the next deploy. No Lighthouse run: a CLI has
  # no web page to audit.
  reports:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-reports
          path: raw
      - name: Assemble site/reports
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p site/reports/tests site/reports/coverage
          cp raw/junit.xml site/reports/tests/junit.xml
          cp -r raw/htmlcov/. site/reports/coverage/
          cp raw/coverage.xml site/reports/coverage/coverage.xml
          cat > site/reports/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>${REPO} reports</title>
          <h1>${REPO} reports</h1>
          <p>Commit ${SHA}, built $(date -u +%Y-%m-%d).</p>
          <ul>
            <li><a href="coverage/">Coverage</a> (<a href="coverage/coverage.xml">coverage.xml</a>)</li>
            <li><a href="tests/junit.xml">Test results</a> (JUnit XML)</li>
          </ul>
          HTML
          grep -q '<coverage ' site/reports/coverage/coverage.xml
          grep -q '<testsuite' site/reports/tests/junit.xml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # One Pages deployment per repo, and a second replaces the first: if this
  # repo ever grows docs, build them into site/docs in the job above rather
  # than adding another deploy.
  deploy-reports:
    needs: reports
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    # A newer push must not cancel a deploy that's already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds whether or not the URL answers, so fetch the real
      # file. page_url is the repo's own address, which covers a normal repo
      # (<owner>.github.io/<repo>/) and a user-site repo (root) alike.
      - name: Smoke test the live reports
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pinned like any other toolchain. The Python version itself comes
          # from .python-version, which setup-uv reads without being told to.
          version: "0.12.7"
      - name: uv build
        # Proves the wheel and sdist still build before anyone merges.
        # Nothing publishes them — this template doesn't wire a registry up;
        # a project stamped from it adds that the day it needs one.
        run: uv build

  # No release-job counterpart, unlike package-linux — a flake has
  # nothing to publish. `nix run github:alrayyes/scaffold-python-cli`
  # (or `nix profile install`) resolves the flake straight from
  # whatever commit is asked for; the commit itself is the
  # distributable artifact, so this only ever needs to prove the flake
  # still builds.
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: nix build
        run: nix build --print-build-logs
      - name: nix run
        run: nix run . -- --help

  # Dry run of the same build package-linux.yml's release-job call does,
  # against a fixed dev version — proves the .deb/.rpm still build and
  # actually install before a change to the Dockerfile's pyinstaller
  # stage, nfpm.yaml, or either script only gets exercised for real
  # against a tagged release.
  package-linux:
    uses: ./.github/workflows/package-linux.yml
    with:
      version: "0.0.0-dev"

  # Dry run of the AUR PKGBUILD, against a local source tarball built
  # from the current checkout rather than a real GitHub release — so
  # a PKGBUILD change gets exercised on every push/PR, not only for
  # real against a tagged release. makepkg refuses to run as root, so
  # this creates a build user the same way the release job's
  # container does.
  aur:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      # archlinux:latest ships no git at all. Confirmed live: with git
      # missing, actions/checkout falls back to downloading a tarball
      # via the GitHub REST API instead of a real clone — the checkout
      # succeeds, but the result has no .git directory, so `git
      # archive HEAD` two steps later fails with "not a git
      # repository". git has to be present before checkout runs, not
      # just before the steps that call it directly.
      - name: Bootstrap git for checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tooling
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel sudo man-db \
            python-build python-installer python-wheel python-uv-build \
            python-platformdirs python-tomli-w python-typer
          # The archlinux image's own pacman.conf excludes man pages
          # from every install by default (an image-size optimization,
          # not real Arch behavior) — confirmed live: a package
          # correctly containing a man page still installed as if it
          # didn't, silently. Removed so the man-page check below is
          # actually meaningful.
          sed -i '/^NoExtract.*man/d' /etc/pacman.conf
          # actions/checkout's own dubious-ownership fix writes into a
          # temporary $HOME that only exists for that step — a
          # `container:` job running as root never sees it again in
          # later steps' real $HOME, so any git command from here on
          # (git archive below included) hits "detected dubious
          # ownership" without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - name: Build a local source tarball standing in for a GitHub release
        run: |
          mkdir -p /tmp/src
          git archive --prefix=scaffold-python-cli-scaffold-python-cli-v0.0.0/ \
            -o /tmp/src/scaffold-python-cli-0.0.0.tar.gz HEAD
          chmod -R a+rwX /tmp/src "$GITHUB_WORKSPACE"
      - name: Prepare a dev PKGBUILD pointing at that tarball
        run: |
          sed \
            -e "s/^pkgver=.*/pkgver=0.0.0/" \
            -e "s#^source=.*#source=(\"file:///tmp/src/scaffold-python-cli-0.0.0.tar.gz\")#" \
            -e "s/^sha256sums=.*/sha256sums=('SKIP')/" \
            PKGBUILD > /tmp/src/PKGBUILD
      - name: Install AUR-only build dependencies
        run: su builder -c "bash '$GITHUB_WORKSPACE/scripts/install-aur-builddeps.sh'"
      - name: makepkg
        run: su builder -c "cd /tmp/src && makepkg -s --noconfirm --nocheck"
      - name: Install and verify
        run: |
          pacman -U --noconfirm /tmp/src/scaffold-python-cli-0.0.0-1-any.pkg.tar.zst
          scaffold-python-cli --help
          man -w scaffold-python-cli

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
