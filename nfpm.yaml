# .deb/.rpm packaging config for nfpm (https://nfpm.goreleaser.com).
#
# nfpm doesn't build Python — it only wraps files that already exist —
# so this packages the PyInstaller-frozen binary from
# scripts/build-binary.sh rather than depending on distro python3-*
# packages, whose naming and available versions differ between Debian
# and Fedora. The AUR PKGBUILD builds "for real" instead, against
# Arch's own python-* packages.
#
# VERSION is passed as an environment variable by whatever invokes
# `nfpm package` (the release-please tag, with its leading "v"
# stripped, or a fixed dev value for a CI dry run).
name: scaffold-python-cli
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Ryan Kes <ryan@andthensome.nl>
description: |
  GitHub template for a Python/uv/Typer command-line tool.
homepage: https://github.com/alrayyes/scaffold-python-cli
# No licence chosen for this template itself — see LICENSE. A project
# stamped from it replaces this the same time it replaces that file.
license: Unlicensed

contents:
  - src: ./dist-pyinstaller/scaffold-python-cli
    dst: /usr/bin/scaffold-python-cli
    file_info:
      mode: 0755
  # One page per command and subcommand, from scripts/generate-man.sh.
  - src: ./man/*.1.gz
    dst: /usr/share/man/man1/
  - src: ./LICENSE
    dst: /usr/share/doc/scaffold-python-cli/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/scaffold-python-cli/README.md
